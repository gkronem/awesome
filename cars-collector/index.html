<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radiator Springs — Collector's Edition</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000;font-family:'Impact','Arial Black',sans-serif}
canvas#bg{position:fixed;inset:0;width:100%;height:100%}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:8}
#vig{position:fixed;inset:0;z-index:9;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,0.42) 68%,rgba(0,0,0,0.84) 100%)}
#ui{position:fixed;inset:0;z-index:12;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
#intro{text-align:center;animation:fadeUp 2s cubic-bezier(.22,1,.36,1) forwards}
.t-main{font-size:clamp(48px,9vw,108px);color:#ffd700;text-shadow:0 0 40px #ff6b00,0 0 80px #ff3300,0 6px 12px #000,4px 4px 0 #8b0000;letter-spacing:6px;line-height:1}
.t-div{width:clamp(160px,30vw,360px);height:2px;background:linear-gradient(to right,transparent,#ffd700,transparent);margin:14px auto}
.t-sub{font-family:'Georgia',serif;font-size:clamp(13px,2.2vw,26px);color:#fff;text-shadow:0 2px 10px #000;letter-spacing:10px}
.t-route{font-size:clamp(20px,3.2vw,40px);color:#e8722a;text-shadow:0 2px 6px #000;margin-top:10px}
.t-hint{font-family:'Georgia',serif;font-size:clamp(11px,1.3vw,15px);color:rgba(255,255,255,0.45);letter-spacing:3px;margin-top:30px;animation:pulse 2s ease-in-out infinite}
#car-card{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity 0.45s ease;pointer-events:none}
#car-card.show{opacity:1;pointer-events:all}
.card-frame{position:relative;border:2px solid rgba(255,215,0,0.35);border-radius:14px;padding:clamp(14px,2.2vw,28px) clamp(22px,4vw,50px);background:linear-gradient(160deg,rgba(0,0,0,0.62) 0%,rgba(20,10,0,0.78) 100%);backdrop-filter:blur(6px);box-shadow:0 0 0 1px rgba(255,215,0,0.08),0 0 60px rgba(0,0,0,0.9),inset 0 0 40px rgba(0,0,0,0.3);text-align:center;max-width:min(94vw,680px)}
.card-frame::before,.card-frame::after{content:'';position:absolute;width:18px;height:18px;border-color:#ffd700;border-style:solid}
.card-frame::before{top:-1px;left:-1px;border-width:2px 0 0 2px;border-radius:4px 0 0 0}
.card-frame::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0;border-radius:0 0 4px 0}
.cc-tr,.cc-bl{position:absolute;width:18px;height:18px;border-color:#ffd700;border-style:solid}
.cc-tr{top:-1px;right:-1px;border-width:2px 2px 0 0;border-radius:0 4px 0 0}
.cc-bl{bottom:-1px;left:-1px;border-width:0 0 2px 2px;border-radius:0 0 0 4px}
.c-num{font-size:clamp(11px,1.6vw,17px);color:rgba(255,215,0,0.42);letter-spacing:5px;margin-bottom:10px}
.c-svg{width:clamp(220px,38vw,440px);height:clamp(90px,16vw,180px);margin:0 auto 14px;filter:drop-shadow(0 8px 28px rgba(0,0,0,0.95)) drop-shadow(0 0 20px var(--glow,#ff4400));animation:carFloat 3.4s ease-in-out infinite;display:flex;align-items:center;justify-content:center}
.c-svg svg{width:100%;height:100%}
@keyframes carFloat{0%,100%{transform:translateY(0) rotate(-1deg) scale(1)}50%{transform:translateY(-10px) rotate(1deg) scale(1.04)}}
.c-name{font-size:clamp(24px,4.2vw,56px);color:#ffd700;text-shadow:0 0 25px var(--glow,#ff4400),0 0 50px var(--glow,#ff4400),0 4px 12px #000,3px 3px 0 var(--shadow,#660000);letter-spacing:3px;line-height:1.1}
.c-rule{width:60%;height:1px;background:linear-gradient(to right,transparent,rgba(255,215,0,0.4),transparent);margin:9px auto}
.c-sub{font-family:'Georgia',serif;font-size:clamp(11px,1.5vw,18px);color:rgba(255,255,255,0.82);letter-spacing:4px}
.c-tag{font-family:'Georgia',serif;font-size:clamp(10px,1.1vw,13px);color:rgba(255,200,80,0.58);letter-spacing:2px;margin-top:6px;font-style:italic}
#progress{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:30;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,0.22);transition:all .35s;cursor:pointer;pointer-events:all}
.dot.active{background:#ffd700;transform:scale(1.5);width:20px;border-radius:4px}
#trans{position:fixed;inset:0;z-index:50;background:#000;opacity:0;pointer-events:none;transition:opacity .32s ease}
#trans.flash{opacity:1}
#badge{position:fixed;top:16px;right:16px;z-index:30;text-align:right;pointer-events:none}
.bl{font-size:12px;letter-spacing:2px;text-shadow:0 1px 6px #000}
#counter{position:fixed;top:16px;left:16px;z-index:30;pointer-events:none;font-family:'Georgia',serif;font-size:12px;color:rgba(255,255,255,0.36);letter-spacing:2px;text-shadow:0 1px 4px #000}
#r66{position:fixed;bottom:48px;right:18px;z-index:30;pointer-events:none}
#outro{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity .6s;pointer-events:none;text-align:center;gap:10px}
#outro.show{opacity:1}
.o-t{font-size:clamp(34px,6vw,72px);color:#ffd700;text-shadow:0 0 40px #ff6b00,0 5px 12px #000,3px 3px 0 #8b0000;letter-spacing:5px}
.o-r{width:clamp(140px,25vw,320px);height:2px;background:linear-gradient(to right,transparent,#ffd700,transparent)}
.o-s{font-family:'Georgia',serif;font-size:clamp(12px,1.8vw,22px);color:#fff;letter-spacing:5px;text-shadow:0 2px 8px #000}
.o-n{font-size:clamp(52px,9vw,96px);color:#e8722a;text-shadow:0 0 30px #ff6b00,0 4px 10px #000;line-height:1}
.o-i{font-family:'Georgia',serif;font-size:clamp(10px,1.4vw,15px);color:rgba(255,210,100,0.7);letter-spacing:2px}
.o-rep{font-family:'Georgia',serif;font-size:12px;color:rgba(255,255,255,0.28);letter-spacing:2px;margin-top:18px;animation:pulse 2s ease-in-out infinite}
@keyframes fadeUp{from{opacity:0;transform:translateY(50px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:0.3}50%{opacity:0.9}}
</style>
</head>
<body>
<canvas id="bg"></canvas><canvas id="fx"></canvas>
<div id="vig"></div><div id="trans"></div>
<div id="ui"><div id="intro">
  <div class="t-main">RADIATOR SPRINGS</div>
  <div class="t-div"></div>
  <div class="t-sub">COLLECTOR'S EDITION</div>
  <div class="t-route">&#9889;&nbsp;DISNEY &middot; PIXAR CARS&nbsp;&#9889;</div>
  <div class="t-hint">CLICK OR TAP TO BEGIN</div>
</div></div>
<div id="car-card"><div class="card-frame">
  <div class="cc-tr"></div><div class="cc-bl"></div>
  <div class="c-num" id="c-num">01 / 12</div>
  <div class="c-svg" id="c-svg"></div>
  <div class="c-name" id="c-name"></div>
  <div class="c-rule"></div>
  <div class="c-sub" id="c-sub"></div>
  <div class="c-tag" id="c-tag"></div>
</div></div>
<div id="outro">
  <div class="o-t">COLLECTION COMPLETE</div><div class="o-r"></div>
  <div class="o-s">RADIATOR SPRINGS &middot; COLLECTOR'S EDITION</div>
  <div class="o-n">12</div>
  <div class="o-i">DISNEY &middot; PIXAR CARS DIECAST CHARACTERS</div>
  <div class="o-rep">CLICK TO REPLAY</div>
</div>
<div id="progress"></div>
<div id="badge"><div class="bl" style="color:#ffd700">COLLECTOR'S SHOWCASE</div><div class="bl" style="color:#e8722a;font-size:10px">DISNEY &middot; PIXAR CARS</div></div>
<div id="counter"></div>
<div id="r66"><svg width="44" height="52" viewBox="0 0 44 52" fill="none"><path d="M22 1L43 10L43 30Q43 46 22 51Q1 46 1 30L1 10Z" fill="#1a1a4e" stroke="#ffd700" stroke-width="2"/><text x="22" y="20" text-anchor="middle" font-family="Impact" font-size="7" fill="#ffd700">ROUTE</text><text x="22" y="34" text-anchor="middle" font-family="Impact" font-size="14" fill="#fff">66</text></svg></div>

<script>
// ═══ Disney/Pixar-quality SVG character illustrations ═══

const D=`<defs>
<radialGradient id="bd" cx="50%" cy="22%" r="80%"><stop offset="0%" stop-color="var(--c1)"/><stop offset="70%" stop-color="var(--c2)"/><stop offset="100%" stop-color="var(--c3)"/></radialGradient>
<radialGradient id="ey" cx="34%" cy="28%" r="66%"><stop offset="0%" stop-color="var(--e1)"/><stop offset="55%" stop-color="var(--e2)"/><stop offset="100%" stop-color="var(--e3)"/></radialGradient>
<filter id="ds"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity="0.38"/></filter>
<filter id="gs"><feGaussianBlur stdDeviation="4"/></filter>
</defs>`;

// eye(cx,cy,rx,ry) → Disney-style eye SVG string (uses #ey gradient)
function eye(cx,cy,rx,ry,lidFill){
  const lx=rx*0.7,ly=ry*0.78,px=rx*0.33,py=ry*0.4;
  return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="white"/>
<ellipse cx="${cx}" cy="${cy+1}" rx="${lx}" ry="${ly}" fill="url(#ey)"/>
<ellipse cx="${cx+2}" cy="${cy-1}" rx="${px}" ry="${py}" fill="#0d1e33"/>
<circle cx="${cx+rx*0.26}" cy="${cy-ry*0.28}" r="${Math.max(2,rx*0.18)}" fill="rgba(255,255,255,0.9)"/>
<path d="M${cx-rx} ${cy-ry*0.15} C${cx-rx*0.4} ${cy-ry*1.35} ${cx+rx*0.4} ${cy-ry*1.35} ${cx+rx} ${cy-ry*0.15} L${cx+rx} ${cy-ry*0.5} C${cx+rx*0.4} ${cy-ry*1.6} ${cx-rx*0.4} ${cy-ry*1.6} ${cx-rx} ${cy-ry*0.5} Z" fill="${lidFill}" opacity="0.7"/>`;
}

function wheel(cx,cy,r){
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#111"/><circle cx="${cx}" cy="${cy}" r="${r*0.67}" fill="#181818"/><circle cx="${cx}" cy="${cy}" r="${r*0.36}" fill="#242424"/><circle cx="${cx}" cy="${cy}" r="${r*0.18}" fill="#444"/><circle cx="${cx-r*0.22}" cy="${cy-r*0.22}" r="${r*0.1}" fill="rgba(255,255,255,0.1)"/>`;
}

function shadow(cx,rx){
  return `<ellipse cx="${cx}" cy="109" rx="${rx}" ry="7" fill="rgba(0,0,0,0.32)" filter="url(#gs)"/>`;
}

${D}${shadow(148,112)}
<path d="M22 78C16 78 14 70 14 62L14 50C14 40 26 36 42 30L70 22C86 8 114 4 148 3L180 3C210 3 236 12 254 26L276 42C286 48 288 56 288 64L288 75C288 80 282 80 276 80Z" fill="url(#bd)" filter="url(#ds)"/>

${wheel(66,82,22)}${wheel(232,82,22)}
</svg>`;
}

function svgMater(){
return `<svg viewBox="0 0 280 115" xmlns="http://www.w3.org/2000/svg" style="--c1:#b07840;--c2:#8b5e2a;--c3:#4a2e0a;--e1:#b0e060;--e2:#8dc430;--e3:#4a7010">

${wheel(38,72,16)}${wheel(148,72,16)}
</svg>`;
}

// ─── 3. MACK ───────────────────────────────────────────────────────────────────
function svgMack(){
return `<svg viewBox="0 0 340 115" xmlns="http://www.w3.org/2000/svg" style="--c1:#2a6ad0;--c2:#1a4fa0;--c3:#0a2860;--e1:#9ad4f5;--e2:#3a8ec4;--e3:#1a5080">
${D}
<ellipse cx="170" cy="109" rx="136" ry="7" fill="rgba(0,0,0,0.32)" filter="url(#gs)"/>
<rect x="86" y="18" width="240" height="66" rx="6" fill="url(#bd)"/>
<rect x="88" y="20" width="236" height="12" fill="rgba(255,255,255,0.1)" rx="3"/>
<rect x="88" y="20" width="236" height="64" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" rx="5"/>
<ellipse cx="204" cy="53" rx="46" ry="26" fill="#e87820" opacity="0.95"/>
<ellipse cx="204" cy="53" rx="42" ry="22" fill="#d06010" opacity="0.9"/>
<text x="204" y="48" text-anchor="middle" font-family="Impact" font-size="11" fill="white">Rust-eze</text>
<text x="204" y="62" text-anchor="middle" font-family="Arial" font-size="7" fill="rgba(255,255,255,0.8)" letter-spacing="1">RACING</text>
<rect x="278" y="22" width="46" height="60" rx="2" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
<path d="M8 80L8 34Q8 22 22 20L84 18L84 80Z" fill="url(#bd)" filter="url(#ds)"/>

<rect x="70" y="6" width="5" height="15" rx="2" fill="#999"/><rect x="77" y="8" width="5" height="13" rx="2" fill="#999"/>
${eye(30,36,11,12,'#0a2860')}${eye(54,36,11,12,'#0a2860')}
${wheel(26,82,15)}${wheel(116,82,15)}${wheel(146,82,15)}${wheel(262,82,15)}${wheel(294,82,15)}

// ─── 4. RED (fire truck) ────────────────────────────────────────────────────────
function svgRed(){
return `<svg viewBox="0 0 240 120" xmlns="http://www.w3.org/2000/svg" style="--c1:#ff3a20;--c2:#cc1800;--c3:#8a0000;--e1:#9ad4f5;--e2:#3a8ec4;--e3:#1a5080">
${D}${shadow(120,113)}
<path d="M18 80Q12 80 12 72L12 54Q12 42 24 38L58 30Q66 16 84 14L118 14Q138 14 150 24L166 38Q174 44 174 56L174 74Q174 80 168 80Z" fill="url(#bd)" filter="url(#ds)"/>

// ─── 5. CHICK HICKS ────────────────────────────────────────────────────────────
function svgChick(){
return `<svg viewBox="0 0 300 115" xmlns="http://www.w3.org/2000/svg" style="--c1:#34a034;--c2:#1a6e1a;--c3:#0a3a0a;--e1:#60b060;--e2:#2a7a2a;--e3:#103010">
${D}${shadow(148,108)}
<path d="M22 78C16 78 14 70 14 62L14 50C14 40 26 36 42 30L70 22C88 8 116 4 150 3L182 3C210 3 238 12 256 26L278 42C288 48 290 56 290 64L290 75C290 80 284 80 278 80Z" fill="url(#bd)" filter="url(#ds)"/>
<path d="M38 34C90 26 190 24 262 34" fill="none" stroke="rgba(80,180,80,0.22)" stroke-width="14" stroke-linecap="round"/>
<path d="M98 36C113 10 146 3 176 3L204 3C232 4 252 16 266 34L280 38Z" fill="#0a3a0a" opacity="0.72"/>
<path d="M112 34C126 8 152 3 176 3L202 3C228 5 246 18 258 34L266 36Z" fill="#80b880" opacity="0.38"/>

function drawStars(){STARS.forEach(s=>{const b=(Math.sin(T*s.sp+s.ph)+1)/2;ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${0.1+b*0.9})`;ctx.fill();});}
function sun(){const sx=W*0.76,sy=H*0.21+Math.sin(T*0.006)*H*0.018,r=Math.min(W,H)*0.054;const g1=ctx.createRadialGradient(sx,sy,0,sx,sy,r*5);g1.addColorStop(0,'rgba(255,235,60,0.5)');g1.addColorStop(0.3,'rgba(255,130,0,0.25)');g1.addColorStop(1,'transparent');ctx.fillStyle=g1;ctx.fillRect(sx-r*5,sy-r*5,r*10,r*10);const g2=ctx.createRadialGradient(sx,sy,0,sx,sy,r);g2.addColorStop(0,'#fffbe0');g2.addColorStop(0.5,'#ffd700');g2.addColorStop(1,'#ff8c00');ctx.beginPath();ctx.arc(sx,sy,r,0,Math.PI*2);ctx.fillStyle=g2;ctx.fill();}
function mountains(){const by=H*0.72;let g=ctx.createLinearGradient(0,by-230,0,by);g.addColorStop(0,'#3a1808');g.addColorStop(1,'#170600');ctx.fillStyle=g;const f=[[0,95],[.07,162],[.17,82],[.28,198],[.40,122],[.52,214],[.63,142],[.74,202],[.85,112],[.93,172],[1,96]];ctx.beginPath();ctx.moveTo(0,by);f.forEach(([x,d])=>ctx.lineTo(W*x,by-d));ctx.lineTo(W,by);ctx.closePath();ctx.fill();ctx.fillStyle='#0c0400';const n=[[0,52],[.06,92],[.13,38],[.23,72],[.36,26],[.50,62],[.61,20],[.75,82],[.86,46],[.96,60],[1,38]];ctx.beginPath();ctx.moveTo(0,by);n.forEach(([x,d])=>ctx.lineTo(W*x,by-d));ctx.lineTo(W,by);ctx.closePath();ctx.fill();}
function buildings(){const by=H*0.72;ctx.fillStyle='#100600';ctx.beginPath();ctx.moveTo(W*.04,by);ctx.lineTo(W*.04,by-80);ctx.quadraticCurveTo(W*.065,by-96,W*.09,by-80);ctx.lineTo(W*.09,by-56);ctx.lineTo(W*.13,by-56);ctx.lineTo(W*.13,by);ctx.fill();ctx.beginPath();ctx.moveTo(W*.15,by);ctx.lineTo(W*.15,by-64);ctx.lineTo(W*.175,by-86);ctx.lineTo(W*.2,by-64);ctx.lineTo(W*.2,by);ctx.fill();ctx.beginPath();ctx.moveTo(W*.22,by);ctx.lineTo(W*.22,by-36);ctx.lineTo(W*.217,by-36);ctx.lineTo(W*.217,by-103);ctx.arc(W*.228,by-114,13,Math.PI*.75,Math.PI*.25,true);ctx.lineTo(W*.239,by-103);ctx.lineTo(W*.239,by-36);ctx.lineTo(W*.236,by-36);ctx.lineTo(W*.236,by);ctx.fill();ctx.beginPath();ctx.moveTo(W*.26,by);ctx.lineTo(W*.26,by-98);ctx.lineTo(W*.305,by-116);ctx.lineTo(W*.35,by-98);ctx.lineTo(W*.35,by);ctx.fill();[0,1,2].forEach(i=>{const cx=W*(0.73+i*0.04);ctx.beginPath();ctx.moveTo(cx-13,by);ctx.lineTo(cx,by-63+i*4);ctx.lineTo(cx+13,by);ctx.fill();});ctx.beginPath();ctx.moveTo(W*.82,by);ctx.lineTo(W*.82,by-72);ctx.arc(W*.843,by-72,W*.023,Math.PI,0);ctx.lineTo(W*.866,by);ctx.fill();ctx.beginPath();ctx.moveTo(W*.9,by);ctx.lineTo(W*.9,by-86);ctx.lineTo(W*.86,by-96);ctx.lineTo(W*.95,by-108);ctx.lineTo(W,by-90);ctx.lineTo(W,by);ctx.fill();const wc=`rgba(255,${150+Math.sin(T*.35)*35|0},38,0.82)`;ctx.fillStyle=wc;[[.064,by-66],[.17,by-52],[.283,by-83],[.31,by-90],[.842,by-60],[.92,by-70]].forEach(([wx,wy])=>ctx.fillRect(W*wx-3,wy,7,9));}
function road(){const ry=H*0.72;const rg=ctx.createLinearGradient(0,ry,0,H);rg.addColorStop(0,'#222');rg.addColorStop(1,'#0c0c0c');ctx.fillStyle=rg;ctx.fillRect(0,ry,W,H-ry);ctx.fillStyle='rgba(255,255,255,0.22)';ctx.fillRect(0,ry+2,W,3);ctx.fillStyle='#ffd700';const dw=68,gap=58,tot=dw+gap,off=(T*52)%tot;for(let x=-tot+off;x<W+tot;x+=tot)ctx.fillRect(x,H*0.748,dw,6);const sg=ctx.createLinearGradient(0,H*0.72-28,0,H*0.72);sg.addColorStop(0,'#c07830');sg.addColorStop(1,'#885830');ctx.fillStyle=sg;ctx.fillRect(0,H*0.718,W,8);}
let particles=[],currentGlow='#ff4400';
function spawnP(){if(Math.random()>0.35)return;const cx=W/2,cy=H*0.38,a=Math.random()*Math.PI*2,sp=Math.random()*1.8+0.6;particles.push({x:cx+(Math.random()-0.5)*80,y:cy+(Math.random()-0.5)*40,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.2,life:1,decay:Math.random()*0.012+0.008,r:Math.random()*3+1.5});if(particles.length>180)particles.splice(0,30);}
function drawP(){fctx.clearRect(0,0,W,H);particles.forEach((p,i)=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.04;p.life-=p.decay;if(p.life<=0){particles.splice(i,1);return;}fctx.beginPath();fctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);fctx.fillStyle=`rgba(255,200,60,${p.life*0.7})`;fctx.fill();});}
function frame(){ctx.clearRect(0,0,W,H);sky();drawStars();sun();mountains();buildings();road();spawnP();drawP();T+=0.016;requestAnimationFrame(frame);}frame();

// ═══ SLIDESHOW ═══
const introEl=document.querySelector('#intro'),cardEl=document.getElementById('car-card'),outroEl=document.getElementById('outro');
const cNum=document.getElementById('c-num'),cSvgEl=document.getElementById('c-svg'),cName=document.getElementById('c-name'),cSub=document.getElementById('c-sub'),cTag=document.getElementById('c-tag');
const progressEl=document.getElementById('progress'),transEl=document.getElementById('trans'),counterEl=document.getElementById('counter'),uiEl=document.getElementById('ui');
let current=-2,timer;
CARS.forEach((_,i)=>{const d=document.createElement('div');d.className='dot';d.id=`dot-${i}`;d.addEventListener('click',()=>{clearTimeout(timer);jumpTo(i);});progressEl.appendChild(d);});
function flash(fn){transEl.classList.add('flash');setTimeout(()=>{fn();setTimeout(()=>transEl.classList.remove('flash'),55);},320);}
function setDot(i){document.querySelectorAll('.dot').forEach(d=>d.classList.remove('active'));const d=document.getElementById(`dot-${i}`);if(d)d.classList.add('active');}
function showCar(i){const c=CARS[i];flash(()=>{uiEl.style.display='none';outroEl.classList.remove('show');cardEl.style.setProperty('--glow',c.glow);cardEl.style.setProperty('--shadow',c.shadow);cNum.textContent=`${String(i+1).padStart(2,'0')} / ${CARS.length}`;cSvgEl.innerHTML=c.svg();cName.textContent=c.name;cName.style.setProperty('--glow',c.glow);cName.style.setProperty('--shadow',c.shadow);cSub.textContent=c.sub;cTag.textContent=c.tag;cardEl.classList.add('show');counterEl.textContent=`${i+1} of ${CARS.length}`;currentGlow=c.glow;particles=[];setDot(i);current=i;});}
function showOutro(){flash(()=>{cardEl.classList.remove('show');counterEl.textContent='';particles=[];document.querySelectorAll('.dot').forEach(d=>d.classList.remove('active'));outroEl.classList.add('show');current=CARS.length;});}
function showIntroScreen(){flash(()=>{cardEl.classList.remove('show');outroEl.classList.remove('show');counterEl.textContent='';particles=[];document.querySelectorAll('.dot').forEach(d=>d.classList.remove('active'));uiEl.style.display='flex';introEl.style.animation='none';introEl.offsetHeight;introEl.style.animation='fadeUp 1.8s cubic-bezier(.22,1,.36,1) forwards';current=-2;});}
function scheduleNext(idx){clearTimeout(timer);timer=setTimeout(advance,idx<0?5200:idx>=CARS.length?7000:5000);}
function jumpTo(idx){if(idx>=0&&idx<CARS.length)showCar(idx);else if(idx>=CARS.length)showOutro();else showIntroScreen();scheduleNext(idx);}
function advance(){if(current===-2)jumpTo(0);else if(current<CARS.length-1)jumpTo(current+1);else if(current===CARS.length-1)jumpTo(CARS.length);else jumpTo(-2);}
document.addEventListener('click',e=>{if(e.target.closest('.dot'))return;clearTimeout(timer);advance();});
timer=setTimeout(()=>advance(),4200);
</script>
</body>
