<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radiator Springs — Collector's Edition</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100vw; height:100vh; overflow:hidden; background:#000; font-family:'Impact','Arial Black',sans-serif; }
canvas#bg { position:fixed; inset:0; width:100%; height:100%; }
canvas#fx { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:8; }

/* Cinematic vignette */
#vignette {
  position:fixed; inset:0; z-index:9; pointer-events:none;
  background: radial-gradient(ellipse at center,
    transparent 40%,
    rgba(0,0,0,0.35) 70%,
    rgba(0,0,0,0.75) 100%);
}

/* Film grain */
#grain {
  position:fixed; inset:0; z-index:11; pointer-events:none;
  opacity:0.04;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-repeat: repeat;
  background-size: 200px 200px;
}

/* ── UI ── */
#ui { position:fixed; inset:0; z-index:12; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; }

/* ── INTRO ── */
#intro { text-align:center; animation:fadeUp 2s cubic-bezier(.22,1,.36,1) forwards; }
.t-main {
  font-size:clamp(50px,9vw,108px); color:#ffd700;
  text-shadow:0 0 40px #ff6b00,0 0 80px #ff3300,0 6px 12px #000,4px 4px 0 #8b0000;
  letter-spacing:6px; line-height:1;
}
.t-divider { width:clamp(160px,30vw,360px); height:2px; background:linear-gradient(to right,transparent,#ffd700,transparent); margin:14px auto; }
.t-sub { font-family:'Georgia',serif; font-size:clamp(13px,2.2vw,26px); color:#fff; text-shadow:0 2px 10px #000; letter-spacing:10px; }
.t-route { font-size:clamp(20px,3.2vw,40px); color:#e8722a; text-shadow:0 2px 6px #000; margin-top:10px; }
.t-hint { font-family:'Georgia',serif; font-size:clamp(11px,1.3vw,15px); color:rgba(255,255,255,0.45); letter-spacing:3px; margin-top:30px; animation:pulse 2s ease-in-out infinite; }

/* ── COLLECTOR CARD ── */
#car-card {
  position:fixed; inset:0; z-index:20;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  opacity:0; transition:opacity 0.45s ease;
  pointer-events:none;
}
#car-card.show { opacity:1; pointer-events:all; }

.card-frame {
  position:relative;
  border:2px solid rgba(255,215,0,0.35);
  border-radius:12px;
  padding:clamp(20px,3vw,36px) clamp(28px,5vw,60px);
  background:linear-gradient(160deg, rgba(0,0,0,0.55) 0%, rgba(20,10,0,0.7) 100%);
  backdrop-filter:blur(4px);
  box-shadow:0 0 0 1px rgba(255,215,0,0.1), 0 0 40px rgba(0,0,0,0.8), inset 0 0 30px rgba(0,0,0,0.3);
  text-align:center;
  max-width:min(90vw,640px);
}
.card-frame::before, .card-frame::after {
  content:''; position:absolute;
  width:18px; height:18px;
  border-color:#ffd700; border-style:solid;
}
.card-frame::before { top:-1px; left:-1px; border-width:2px 0 0 2px; border-radius:4px 0 0 0; }
.card-frame::after  { bottom:-1px; right:-1px; border-width:0 2px 2px 0; border-radius:0 0 4px 0; }
.card-corner-tr, .card-corner-bl {
  position:absolute; width:18px; height:18px;
  border-color:#ffd700; border-style:solid;
}
.card-corner-tr { top:-1px; right:-1px; border-width:2px 2px 0 0; border-radius:0 4px 0 0; }
.card-corner-bl { bottom:-1px; left:-1px; border-width:0 0 2px 2px; border-radius:0 0 0 4px; }

.c-number-badge { font-size:clamp(12px,1.8vw,18px); color:rgba(255,215,0,0.45); letter-spacing:5px; margin-bottom:12px; }

.c-svg-wrap {
  width:clamp(100px,18vw,200px);
  height:clamp(60px,11vw,120px);
  margin:0 auto 18px;
  filter:drop-shadow(0 8px 24px rgba(0,0,0,0.9)) drop-shadow(0 0 16px var(--glow,#ff4400));
  animation:carFloat 3.2s ease-in-out infinite;
}
@keyframes carFloat {
  0%,100%{transform:translateY(0) rotate(-1deg) scale(1);}
  50%{transform:translateY(-10px) rotate(1deg) scale(1.04);}
}

.c-name {
  font-size:clamp(28px,4.8vw,60px); color:#ffd700;
  text-shadow:0 0 25px var(--glow,#ff4400),0 0 50px var(--glow,#ff4400),0 4px 12px #000,3px 3px 0 var(--shadow,#660000);
  letter-spacing:3px; line-height:1.1;
}
.c-rule { width:60%; height:1px; background:linear-gradient(to right,transparent,rgba(255,215,0,0.4),transparent); margin:10px auto; }
.c-sub { font-family:'Georgia',serif; font-size:clamp(11px,1.6vw,18px); color:rgba(255,255,255,0.8); letter-spacing:4px; }
.c-tagline { font-family:'Georgia',serif; font-size:clamp(10px,1.2vw,13px); color:rgba(255,200,80,0.6); letter-spacing:2px; margin-top:7px; font-style:italic; }

/* ── PROGRESS ── */
#progress { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); display:flex; gap:8px; z-index:30; align-items:center; }
.dot { width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,0.22); transition:all 0.35s; cursor:pointer; pointer-events:all; }
.dot.active { background:#ffd700; transform:scale(1.5); width:20px; border-radius:4px; }

/* ── TRANSITION ── */
#trans { position:fixed; inset:0; z-index:50; background:#000; opacity:0; pointer-events:none; transition:opacity 0.32s ease; }
#trans.flash { opacity:1; }

/* ── BADGE ── */
#badge { position:fixed; top:16px; right:16px; z-index:30; text-align:right; pointer-events:none; }
.badge-line { font-size:12px; letter-spacing:2px; text-shadow:0 1px 6px #000; }

/* ── COUNTER ── */
#counter { position:fixed; top:16px; left:16px; z-index:30; pointer-events:none; font-family:'Georgia',serif; font-size:12px; color:rgba(255,255,255,0.38); letter-spacing:2px; text-shadow:0 1px 4px #000; }

/* ── ROUTE 66 BADGE ── */
#r66 { position:fixed; bottom:50px; right:20px; z-index:30; pointer-events:none; text-align:center; }
.r66-shield { width:44px; height:52px; }

/* ── OUTRO ── */
#outro { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:center; opacity:0; transition:opacity 0.6s; pointer-events:none; text-align:center; gap:10px; }
#outro.show { opacity:1; }
.o-title { font-size:clamp(36px,6.5vw,76px); color:#ffd700; text-shadow:0 0 40px #ff6b00,0 5px 12px #000,3px 3px 0 #8b0000; letter-spacing:5px; }
.o-rule { width:clamp(140px,25vw,320px); height:2px; background:linear-gradient(to right,transparent,#ffd700,transparent); }
.o-sub { font-family:'Georgia',serif; font-size:clamp(12px,1.8vw,22px); color:#fff; letter-spacing:5px; text-shadow:0 2px 8px #000; }
.o-count { font-size:clamp(52px,9vw,96px); color:#e8722a; text-shadow:0 0 30px #ff6b00,0 4px 10px #000; line-height:1; }
.o-items { font-family:'Georgia',serif; font-size:clamp(10px,1.4vw,15px); color:rgba(255,210,100,0.7); letter-spacing:2px; }
.o-replay { font-family:'Georgia',serif; font-size:12px; color:rgba(255,255,255,0.3); letter-spacing:2px; margin-top:20px; animation:pulse 2s ease-in-out infinite; }

@keyframes fadeUp { from{opacity:0;transform:translateY(50px);} to{opacity:1;transform:translateY(0);} }
@keyframes pulse { 0%,100%{opacity:0.3;} 50%{opacity:0.9;} }
</style>
</head>
<body>

<canvas id="bg"></canvas>
<canvas id="fx"></canvas>
<div id="vignette"></div>
<div id="grain"></div>
<div id="trans"></div>

<!-- Intro -->
<div id="ui">
  <div id="intro">
    <div class="t-main">RADIATOR SPRINGS</div>
    <div class="t-divider"></div>
    <div class="t-sub">COLLECTOR'S EDITION</div>
    <div class="t-route">&#9889;&nbsp;DISNEY &middot; PIXAR CARS&nbsp;&#9889;</div>
    <div class="t-hint">CLICK OR TAP TO BEGIN</div>
  </div>
</div>

<!-- Car card -->
<div id="car-card">
  <div class="card-frame">
    <div class="card-corner-tr"></div>
    <div class="card-corner-bl"></div>
    <div class="c-number-badge" id="c-badge">01 / 12</div>
    <div class="c-svg-wrap" id="c-svg"></div>
    <div class="c-name" id="c-name">NAME</div>
    <div class="c-rule"></div>
    <div class="c-sub" id="c-sub">SUBTITLE</div>
    <div class="c-tagline" id="c-tag">TAGLINE</div>
  </div>
</div>

<!-- Outro -->
<div id="outro">
  <div class="o-title">COLLECTION COMPLETE</div>
  <div class="o-rule"></div>
  <div class="o-sub">RADIATOR SPRINGS &middot; COLLECTOR'S EDITION</div>
  <div class="o-count">12</div>
  <div class="o-items">DISNEY &middot; PIXAR CARS DIECAST CHARACTERS</div>
  <div class="o-replay">CLICK TO REPLAY</div>
</div>

<!-- Progress -->
<div id="progress"></div>

<!-- Corner badge -->
<div id="badge">
  <div class="badge-line" style="color:#ffd700">COLLECTOR'S SHOWCASE</div>
  <div class="badge-line" style="color:#e8722a;font-size:10px">DISNEY &middot; PIXAR CARS</div>
</div>
<div id="counter"></div>

<!-- Route 66 shield -->
<div id="r66">
  <svg class="r66-shield" viewBox="0 0 44 52" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M22 1 L43 10 L43 30 Q43 46 22 51 Q1 46 1 30 L1 10 Z" fill="#1a1a4e" stroke="#ffd700" stroke-width="2"/>
    <text x="22" y="20" text-anchor="middle" font-family="Impact" font-size="7" fill="#ffd700" letter-spacing="1">ROUTE</text>
    <text x="22" y="33" text-anchor="middle" font-family="Impact" font-size="14" fill="#fff">66</text>
    <text x="22" y="43" text-anchor="middle" font-family="Georgia" font-size="5" fill="rgba(255,215,0,0.6)" letter-spacing="0.5">RADIATOR SPRINGS</text>
  </svg>
</div>

<script>
// ── SVG CAR SHAPES ─────────────────────────────────────────────────────────────
// Each returns an inline SVG string representing a stylised silhouette.
function svgRacer(body, stripe, num, numColor){
  return `<svg viewBox="0 0 200 90" xmlns="http://www.w3.org/2000/svg">
    <defs><filter id="gs"><feGaussianBlur stdDeviation="2"/></filter></defs>
    <!-- shadow -->
    <ellipse cx="100" cy="82" rx="72" ry="7" fill="rgba(0,0,0,0.5)" filter="url(#gs)"/>
    <!-- body -->
    <path d="M18 62 Q14 62 14 56 L14 50 Q14 44 22 44 L36 44 Q42 28 62 22 L110 18 Q136 16 148 22 L170 32 Q180 36 182 44 L186 44 Q192 44 192 50 L192 60 Q192 66 186 66 L18 66 Q14 66 14 62 Z" fill="${body}"/>
    <!-- cabin -->
    <path d="M60 44 Q66 24 90 20 L120 18 Q142 18 152 28 L166 44 Z" fill="${stripe}" opacity="0.9"/>
    <!-- windshield -->
    <path d="M72 42 Q78 26 96 22 L118 21 Q132 22 140 32 L152 42 Z" fill="rgba(180,220,255,0.45)"/>
    <!-- stripe -->
    <rect x="14" y="52" width="178" height="6" fill="${stripe}" opacity="0.55" rx="2"/>
    <!-- number -->
    <text x="100" y="58" text-anchor="middle" font-family="Impact" font-size="14" fill="${numColor}" opacity="0.9">${num}</text>
    <!-- wheels -->
    <circle cx="46" cy="66" r="14" fill="#111"/><circle cx="46" cy="66" r="8" fill="#333"/><circle cx="46" cy="66" r="3" fill="#666"/>
    <circle cx="154" cy="66" r="14" fill="#111"/><circle cx="154" cy="66" r="8" fill="#333"/><circle cx="154" cy="66" r="3" fill="#666"/>
    <!-- eyes -->
    <ellipse cx="82" cy="34" rx="9" ry="10" fill="white"/><ellipse cx="82" cy="34" rx="5" ry="7" fill="#4af"/><ellipse cx="84" cy="32" rx="2" ry="3" fill="#114"/>
    <ellipse cx="118" cy="34" rx="9" ry="10" fill="white"/><ellipse cx="118" cy="34" rx="5" ry="7" fill="#4af"/><ellipse cx="120" cy="32" rx="2" ry="3" fill="#114"/>
  </svg>`;
}

function svgTruck(cab, trailer){
  return `<svg viewBox="0 0 220 90" xmlns="http://www.w3.org/2000/svg">
    <defs><filter id="gs"><feGaussianBlur stdDeviation="2"/></filter></defs>
    <ellipse cx="110" cy="83" rx="90" ry="6" fill="rgba(0,0,0,0.5)" filter="url(#gs)"/>
    <!-- trailer -->
    <rect x="70" y="28" width="140" height="48" rx="4" fill="${trailer}"/>
    <rect x="72" y="30" width="136" height="8" fill="rgba(255,255,255,0.12)" rx="2"/>

    <path d="M10 66 L10 38 Q10 28 22 26 L68 24 L68 66 Z" fill="${cab}"/>

    <ellipse cx="52" cy="38" rx="8" ry="9" fill="white"/><ellipse cx="52" cy="38" rx="4" ry="6" fill="#4af"/><ellipse cx="53" cy="36" rx="2" ry="2.5" fill="#114"/>
    <!-- wheels -->
    <circle cx="28" cy="68" r="13" fill="#111"/><circle cx="28" cy="68" r="7" fill="#333"/><circle cx="28" cy="68" r="3" fill="#555"/>
    <circle cx="100" cy="68" r="13" fill="#111"/><circle cx="100" cy="68" r="7" fill="#333"/><circle cx="100" cy="68" r="3" fill="#555"/>
    <circle cx="128" cy="68" r="13" fill="#111"/><circle cx="128" cy="68" r="7" fill="#333"/><circle cx="128" cy="68" r="3" fill="#555"/>
    <circle cx="192" cy="68" r="13" fill="#111"/><circle cx="192" cy="68" r="7" fill="#333"/><circle cx="192" cy="68" r="3" fill="#555"/>
  </svg>`;
}

function svgTow(body){
  return `<svg viewBox="0 0 180 100" xmlns="http://www.w3.org/2000/svg">
    <defs><filter id="gs"><feGaussianBlur stdDeviation="2"/></filter></defs>
    <ellipse cx="90" cy="88" rx="70" ry="6" fill="rgba(0,0,0,0.5)" filter="url(#gs)"/>
    <!-- hook arm -->
    <line x1="140" y1="30" x2="170" y2="10" stroke="#888" stroke-width="4" stroke-linecap="round"/>
    <path d="M170 10 Q176 4 174 12" fill="none" stroke="#888" stroke-width="3" stroke-linecap="round"/>

    <ellipse cx="76" cy="28" rx="10" ry="11" fill="white"/><ellipse cx="76" cy="28" rx="6" ry="8" fill="#8c6"/><ellipse cx="78" cy="26" rx="2.5" ry="3" fill="#141"/>
    <ellipse cx="106" cy="28" rx="10" ry="11" fill="white"/><ellipse cx="106" cy="28" rx="6" ry="8" fill="#8c6"/><ellipse cx="108" cy="26" rx="2.5" ry="3" fill="#141"/>

    <circle cx="142" cy="70" r="14" fill="#111"/><circle cx="142" cy="70" r="8" fill="#2a2a2a"/><circle cx="142" cy="70" r="3" fill="#555"/>
  </svg>`;
}

function svgFireTruck(body){
  return `<svg viewBox="0 0 180 100" xmlns="http://www.w3.org/2000/svg">
    <defs><filter id="gs"><feGaussianBlur stdDeviation="2"/></filter></defs>

    <ellipse cx="106" cy="32" rx="10" ry="11" fill="white"/><ellipse cx="106" cy="32" rx="6" ry="8" fill="#4af"/><ellipse cx="108" cy="30" rx="2.5" ry="3" fill="#114"/>

    <circle cx="40" cy="68" r="14" fill="#111"/><circle cx="40" cy="68" r="8" fill="#2a2a2a"/><circle cx="40" cy="68" r="3" fill="#555"/>
    <circle cx="140" cy="68" r="14" fill="#111"/><circle cx="140" cy="68" r="8" fill="#2a2a2a"/><circle cx="140" cy="68" r="3" fill="#555"/>

}

function svgPolice(body){
  return `<svg viewBox="0 0 180 90" xmlns="http://www.w3.org/2000/svg">
    <defs><filter id="gs"><feGaussianBlur stdDeviation="2"/></filter></defs>
    <ellipse cx="90" cy="82" rx="66" ry="6" fill="rgba(0,0,0,0.5)" filter="url(#gs)"/>

function svgCombine(body){
  return `<svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
    <defs><filter id="gs"><feGaussianBlur stdDeviation="2"/></filter></defs>
    <ellipse cx="100" cy="92" rx="75" ry="6" fill="rgba(0,0,0,0.5)" filter="url(#gs)"/>
    <!-- header -->
    <rect x="5" y="60" width="130" height="22" rx="4" fill="#777"/>
    <rect x="8" y="58" width="124" height="6" rx="2" fill="#888"/>
    <line x1="24" y1="58" x2="24" y2="82" stroke="#555" stroke-width="3"/>
    <line x1="45" y1="58" x2="45" y2="82" stroke="#555" stroke-width="3"/>
    <line x1="66" y1="58" x2="66" y2="82" stroke="#555" stroke-width="3"/>
    <line x1="87" y1="58" x2="87" y2="82" stroke="#555" stroke-width="3"/>
    <line x1="108" y1="58" x2="108" y2="82" stroke="#555" stroke-width="3"/>
    <!-- body -->
    <path d="M100 72 L100 20 Q100 12 112 12 L168 12 Q180 12 182 24 L182 72 Z" fill="${body}"/>
    <!-- exhaust pipes -->

    <rect x="162" y="5" width="6" height="13" fill="#aaa" rx="2"/>
    <!-- eyes -->
    <ellipse cx="126" cy="34" rx="11" ry="12" fill="white"/><ellipse cx="126" cy="34" rx="6" ry="8" fill="#c33"/><ellipse cx="128" cy="32" rx="3" ry="3.5" fill="#200"/>
    <ellipse cx="158" cy="34" rx="11" ry="12" fill="white"/><ellipse cx="158" cy="34" rx="6" ry="8" fill="#c33"/><ellipse cx="160" cy="32" rx="3" ry="3.5" fill="#200"/>
    <!-- angry brow -->
    <line x1="116" y1="24" x2="136" y2="28" stroke="#600" stroke-width="3" stroke-linecap="round"/>
    <line x1="148" y1="24" x2="168" y2="28" stroke="#600" stroke-width="3" stroke-linecap="round"/>

    <circle cx="124" cy="78" r="14" fill="#111"/><circle cx="124" cy="78" r="8" fill="#2a2a2a"/>
    <circle cx="172" cy="78" r="14" fill="#111"/><circle cx="172" cy="78" r="8" fill="#2a2a2a"/>
  </svg>`;
}

const CARS = [
  { svg:()=>svgRacer('#cc2200','#ffdd00','95','#cc2200'),       name:'LIGHTNING McQUEEN',          sub:'RUSTEZE RACING CENTER',                tag:'"KA-CHOW!" · PISTON CUP CHAMPION · #95',           color:'#cc2200',glow:'#ff4400',shadow:'#660000' },
  { svg:()=>svgTow('#8b5e3c'),                                   name:'MATER',                      sub:'RADIATOR SPRINGS TOW & SALVAGE',       tag:'WORLD\'S BEST BACKWARDS DRIVER · LOYAL FRIEND',    color:'#8b5e3c',glow:'#d4903e',shadow:'#3d2010' },
  { svg:()=>svgTruck('#1a4fa0','#e87a1a'),                       name:'MACK',                       sub:'RUSTEZE RACING TRANSPORT',             tag:'LIGHTNING\'S HAULER · BLUE THUNDER ON THE HIGHWAY',color:'#1a4fa0',glow:'#3a7fd4',shadow:'#0a1a44' },
  { svg:()=>svgFireTruck('#cc2200'),                             name:'RED',                        sub:'RADIATOR SPRINGS FIRE DEPT.',          tag:'BRAVEST HEART · MOST CARING SOUL IN TOWN',         color:'#cc2200',glow:'#ff5500',shadow:'#660000' },
  { svg:()=>svgRacer('#228b22','#111','86','#ffdd00'),           name:'CHICK HICKS',                sub:'HOSTILE TAKEOVER BANK RACING',         tag:'"THUNDER!" · #86 · THE PESKY LITTLE STICKER',      color:'#228b22',glow:'#44cc44',shadow:'#0a3a0a' },
  { svg:()=>svgPolice('#1a1a2a'),                                name:'SHERIFF',                    sub:'RADIATOR SPRINGS POLICE DEPT.',        tag:'GUARDIAN OF ROUTE 66 · LAW OF THE LAND',           color:'#1a1a4e',glow:'#6666cc',shadow:'#000022' },
  { svg:()=>svgRacer('#006699','#ffffff','43','#006699'),        name:'STRIP "THE KING" WEATHERS',  sub:'DINOCO RACING · D.I.N.O.C.O.',         tag:'SEVEN-TIME PISTON CUP CHAMPION · #43',              color:'#006699',glow:'#00aaee',shadow:'#002233' },
  { svg:()=>svgRacer('#990000','#222','95','#e8722a'),           name:'McQUEEN · GRC LIVERY',       sub:'GLOBAL RACING CIRCUIT · CARS 3',       tag:'NEXT-GEN CHALLENGER · JACKSON STORM ERA',          color:'#990000',glow:'#ff2200',shadow:'#330000' },
  { svg:()=>svgRacer('#006699','#00aadd','95','#ffffff'),        name:'DINOCO McQUEEN',             sub:'DINOCO · ALTERNATE UNIVERSE',          tag:'WHAT IF? · #95 · METALLIC BLUE DREAM',             color:'#005588',glow:'#0088cc',shadow:'#001a33' },

  { svg:()=>svgRacer('#336699','#aaccff','','#fff'),             name:'FINN McMISSILE',             sub:'BRITISH INTELLIGENCE · CARS 2',        tag:'SPY · WORLD GRAND PRIX · LICENSE TO RACE',         color:'#336699',glow:'#66aadd',shadow:'#112233' },
];

// ── CANVAS BACKGROUND ──────────────────────────────────────────────────────────
const canvas=document.getElementById('bg'), ctx=canvas.getContext('2d');
const fx=document.getElementById('fx'), fctx=fx.getContext('2d');
let W,H,T=0;
function resize(){ W=canvas.width=fx.width=window.innerWidth; H=canvas.height=fx.height=window.innerHeight; }
resize(); window.addEventListener('resize',resize);

const STARS=Array.from({length:200},()=>({ x:Math.random(),y:Math.random()*0.46,r:Math.random()*1.5+0.25,ph:Math.random()*Math.PI*2,sp:Math.random()*0.8+0.3 }));

function sky(){
  const p=(Math.sin(T*0.005)+1)*0.5;
  const g=ctx.createLinearGradient(0,0,0,H*0.73);
  g.addColorStop(0,`hsl(${240-p*20},${60+p*8}%,${7+p*4}%)`);
  g.addColorStop(0.2,`hsl(${270-p*30},${52+p*6}%,${14+p*8}%)`);
  g.addColorStop(0.44,`hsl(${20+p*8},${80+p*10}%,${36+p*14}%)`);
  g.addColorStop(0.66,`hsl(36,92%,${52+p*6}%)`);
  g.addColorStop(0.84,`hsl(34,86%,46%)`);
  g.addColorStop(1,`hsl(28,58%,30%)`);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H*0.73);
}
function drawStars(){
  STARS.forEach(s=>{
    const b=(Math.sin(T*s.sp+s.ph)+1)/2;
    ctx.beginPath(); ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${0.1+b*0.9})`; ctx.fill();
  });
}
function sun(){
  const sx=W*0.76,sy=H*0.21+Math.sin(T*0.006)*H*0.018,r=Math.min(W,H)*0.054;
  const g1=ctx.createRadialGradient(sx,sy,0,sx,sy,r*5);
  g1.addColorStop(0,'rgba(255,235,60,0.5)'); g1.addColorStop(0.3,'rgba(255,130,0,0.25)'); g1.addColorStop(1,'transparent');
  ctx.fillStyle=g1; ctx.fillRect(sx-r*5,sy-r*5,r*10,r*10);
  const g2=ctx.createRadialGradient(sx,sy,0,sx,sy,r);
  g2.addColorStop(0,'#fffbe0'); g2.addColorStop(0.5,'#ffd700'); g2.addColorStop(1,'#ff8c00');
  ctx.beginPath(); ctx.arc(sx,sy,r,0,Math.PI*2); ctx.fillStyle=g2; ctx.fill();
}
function mountains(){
  const by=H*0.72;
  let g=ctx.createLinearGradient(0,by-230,0,by);
  g.addColorStop(0,'#3a1808'); g.addColorStop(1,'#170600');
  ctx.fillStyle=g;
  const f=[[0,95],[.07,162],[.17,82],[.28,198],[.40,122],[.52,214],[.63,142],[.74,202],[.85,112],[.93,172],[1,96]];
  ctx.beginPath(); ctx.moveTo(0,by); f.forEach(([x,d])=>ctx.lineTo(W*x,by-d)); ctx.lineTo(W,by); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#0c0400';
  const n=[[0,52],[.06,92],[.13,38],[.23,72],[.36,26],[.50,62],[.61,20],[.75,82],[.86,46],[.96,60],[1,38]];
  ctx.beginPath(); ctx.moveTo(0,by); n.forEach(([x,d])=>ctx.lineTo(W*x,by-d)); ctx.lineTo(W,by); ctx.closePath(); ctx.fill();
}
function buildings(){
  const by=H*0.72;
  ctx.fillStyle='#100600';
  // Ramone's
  ctx.beginPath(); ctx.moveTo(W*.04,by); ctx.lineTo(W*.04,by-80); ctx.quadraticCurveTo(W*.065,by-96,W*.09,by-80); ctx.lineTo(W*.09,by-56); ctx.lineTo(W*.13,by-56); ctx.lineTo(W*.13,by); ctx.fill();
  // Flo's V8
  ctx.beginPath(); ctx.moveTo(W*.15,by); ctx.lineTo(W*.15,by-64); ctx.lineTo(W*.175,by-86); ctx.lineTo(W*.2,by-64); ctx.lineTo(W*.2,by); ctx.fill();
  // Water tower
  ctx.beginPath(); ctx.moveTo(W*.22,by); ctx.lineTo(W*.22,by-36); ctx.lineTo(W*.217,by-36); ctx.lineTo(W*.217,by-103); ctx.arc(W*.228,by-114,13,Math.PI*.75,Math.PI*.25,true); ctx.lineTo(W*.239,by-103); ctx.lineTo(W*.239,by-36); ctx.lineTo(W*.236,by-36); ctx.lineTo(W*.236,by); ctx.fill();
  // Curio shop
  ctx.beginPath(); ctx.moveTo(W*.26,by); ctx.lineTo(W*.26,by-98); ctx.lineTo(W*.305,by-116); ctx.lineTo(W*.35,by-98); ctx.lineTo(W*.35,by); ctx.fill();
  // Cactus left
  ctx.fillStyle='#1a3310';
  ctx.beginPath(); ctx.roundRect?ctx.roundRect(W*.39,by-48,8,48,3):ctx.rect(W*.39,by-48,8,48); ctx.fill();
  ctx.beginPath(); ctx.roundRect?ctx.roundRect(W*.382,by-36,10,6,3):ctx.rect(W*.382,by-36,10,6); ctx.fill();
  ctx.beginPath(); ctx.roundRect?ctx.roundRect(W*.39,by-36,16,5,3):ctx.rect(W*.39,by-36,16,5); ctx.fill();
  ctx.fillStyle='#100600';
  // Cozy Cone
  [0,1,2].forEach(i=>{ const cx=W*(0.73+i*0.04); ctx.beginPath(); ctx.moveTo(cx-13,by); ctx.lineTo(cx,by-63+i*4); ctx.lineTo(cx+13,by); ctx.fill(); });
  // Luigi's
  ctx.beginPath(); ctx.moveTo(W*.82,by); ctx.lineTo(W*.82,by-72); ctx.arc(W*.843,by-72,W*.023,Math.PI,0); ctx.lineTo(W*.866,by); ctx.fill();
  // Right
  ctx.beginPath(); ctx.moveTo(W*.9,by); ctx.lineTo(W*.9,by-86); ctx.lineTo(W*.86,by-96); ctx.lineTo(W*.95,by-108); ctx.lineTo(W,by-90); ctx.lineTo(W,by); ctx.fill();
  // Windows
  const wc=`rgba(255,${150+Math.sin(T*.35)*35|0},38,0.82)`;
  ctx.fillStyle=wc;
  [[.064,by-66],[.17,by-52],[.283,by-83],[.31,by-90],[.842,by-60],[.92,by-70]].forEach(([wx,wy])=>ctx.fillRect(W*wx-3,wy,7,9));
}
function road(){
  const ry=H*0.72;
  const rg=ctx.createLinearGradient(0,ry,0,H);
  rg.addColorStop(0,'#222'); rg.addColorStop(1,'#0c0c0c');
  ctx.fillStyle=rg; ctx.fillRect(0,ry,W,H-ry);
  ctx.fillStyle='rgba(255,255,255,0.22)'; ctx.fillRect(0,ry+2,W,3);
  ctx.fillStyle='#ffd700';
  const dw=68,gap=58,tot=dw+gap,off=(T*52)%tot;
  for(let x=-tot+off;x<W+tot;x+=tot) ctx.fillRect(x,H*0.748,dw,6);
  // Desert ground between road and mountains
  const sg=ctx.createLinearGradient(0,H*0.72-28,0,H*0.72);
  sg.addColorStop(0,'#c07830'); sg.addColorStop(1,'#885830');
  ctx.fillStyle=sg; ctx.fillRect(0,H*0.718,W,8);
}

// ── PARTICLE SYSTEM ─────────────────────────────────────────────────────────
let particles=[];
let currentGlow='#ff4400';
function spawnParticles(){
  if(Math.random()>0.35) return;
  const cx=W/2, cy=H*0.38;
  const angle=Math.random()*Math.PI*2;
  const speed=Math.random()*1.8+0.6;
  particles.push({
    x:cx+(Math.random()-0.5)*80, y:cy+(Math.random()-0.5)*40,
    vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed-1.2,
    life:1, decay:Math.random()*0.012+0.008,
    r:Math.random()*3+1.5,
    color:currentGlow
  });
  if(particles.length>180) particles.splice(0,30);
}
function drawParticles(){
  fctx.clearRect(0,0,W,H);
  particles.forEach((p,i)=>{
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.04; p.life-=p.decay;
    if(p.life<=0){ particles.splice(i,1); return; }
    fctx.beginPath();
    fctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);
    const alpha=p.life*0.85;
    fctx.fillStyle=p.color.replace(')',`,${alpha})`);
    // Ensure valid rgba
    fctx.fillStyle=`rgba(255,180,50,${alpha})`;
    fctx.fill();
    // Star shape for some
    if(p.r>3){
      fctx.save();
      fctx.translate(p.x,p.y);
      fctx.rotate(T*2);
      fctx.fillStyle=`rgba(255,240,150,${alpha*0.6})`;
      for(let s=0;s<4;s++){
        fctx.beginPath();
        fctx.ellipse(0,0,p.r*0.4,p.r*2,s*Math.PI/4,0,Math.PI*2);
        fctx.fill();
      }
      fctx.restore();
    }
  });
}

function frame(){
  ctx.clearRect(0,0,W,H);
  sky(); drawStars(); sun(); mountains(); buildings(); road();
  spawnParticles(); drawParticles();
  T+=0.016;
  requestAnimationFrame(frame);
}
frame();

// ── SLIDESHOW ────────────────────────────────────────────────────────────────
const introEl=document.querySelector('#intro');
const cardEl=document.getElementById('car-card');
const outroEl=document.getElementById('outro');
const cBadge=document.getElementById('c-badge');
const cSvgEl=document.getElementById('c-svg');
const cName=document.getElementById('c-name');
const cSub=document.getElementById('c-sub');
const cTag=document.getElementById('c-tag');
const progressEl=document.getElementById('progress');
const transEl=document.getElementById('trans');
const counterEl=document.getElementById('counter');
const uiEl=document.getElementById('ui');

let current=-2, timer;

CARS.forEach((_,i)=>{
  const d=document.createElement('div'); d.className='dot'; d.id=`dot-${i}`;
  d.addEventListener('click',()=>{ clearTimeout(timer); jumpTo(i); });
  progressEl.appendChild(d);
});

function flash(fn){ transEl.classList.add('flash'); setTimeout(()=>{ fn(); setTimeout(()=>transEl.classList.remove('flash'),55); },320); }

function setDot(i){ document.querySelectorAll('.dot').forEach(d=>d.classList.remove('active')); const d=document.getElementById(`dot-${i}`); if(d) d.classList.add('active'); }

function showCar(i){
  const c=CARS[i];
  flash(()=>{
    uiEl.style.display='none'; outroEl.classList.remove('show');
    cardEl.style.setProperty('--glow',c.glow); cardEl.style.setProperty('--shadow',c.shadow);
    cBadge.textContent=`${String(i+1).padStart(2,'0')} / ${CARS.length}`;
    cSvgEl.innerHTML=c.svg();
    cName.textContent=c.name;
    cSub.textContent=c.sub; cTag.textContent=c.tag;
    cName.style.setProperty('--glow',c.glow); cName.style.setProperty('--shadow',c.shadow);
    cardEl.classList.add('show');
    counterEl.textContent=`${i+1} of ${CARS.length}`;
    currentGlow=c.glow; particles=[];
    setDot(i); current=i;
  });
}
function showOutro(){
  flash(()=>{
    cardEl.classList.remove('show');
    counterEl.textContent=''; particles=[];
    document.querySelectorAll('.dot').forEach(d=>d.classList.remove('active'));
    outroEl.classList.add('show'); current=CARS.length;
  });
}
function showIntroScreen(){
  flash(()=>{
    cardEl.classList.remove('show'); outroEl.classList.remove('show');
    counterEl.textContent=''; particles=[];
    document.querySelectorAll('.dot').forEach(d=>d.classList.remove('active'));
    uiEl.style.display='flex';
    introEl.style.animation='none'; introEl.offsetHeight;
    introEl.style.animation='fadeUp 1.8s cubic-bezier(.22,1,.36,1) forwards';
    current=-2;
  });
}
function scheduleNext(idx){ clearTimeout(timer); timer=setTimeout(advance, idx<0?5000:idx>=CARS.length?7000:4800); }
function jumpTo(idx){ if(idx>=0&&idx<CARS.length) showCar(idx); else if(idx>=CARS.length) showOutro(); else showIntroScreen(); scheduleNext(idx); }
function advance(){
  if(current===-2) jumpTo(0);
  else if(current<CARS.length-1) jumpTo(current+1);
  else if(current===CARS.length-1) jumpTo(CARS.length);
  else jumpTo(-2);
}
document.addEventListener('click',e=>{ if(e.target.closest('.dot')) return; clearTimeout(timer); advance(); });
timer=setTimeout(()=>advance(), 4200);
</script>
